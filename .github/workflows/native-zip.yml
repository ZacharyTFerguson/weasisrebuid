name: Native zip

# Outline: second Maven invocation is weasis-distributions (-P compressXZ).
# package-weasis.sh never reads ~/.m2. Stage from reactor target first.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  native-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Reactor install
        run: mvn -B -q install -DskipTests
      - name: Stage from reactor target (no .m2 from-target)
        run: bash weasis-distributions/script/stage-from-reactor.sh
      - name: Package weasis-native.zip
        run: |
          bash weasis-distributions/script/package-weasis.sh \
            --jdk "$JAVA_HOME" \
            --from-target weasis-distributions/target/native-stage \
            --output "$PWD/weasis-native.zip" \
            --skip-jpackage
      - uses: actions/upload-artifact@v4
        with:
          name: weasis-native-zip
          path: weasis-native.zip
