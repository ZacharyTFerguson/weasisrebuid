name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build and test
        run: mvn -B -q package
      - name: Reactor bundle jars
        run: bash scripts/verify-reactor-jars.sh
      - name: DICOM oracle smoke
        env:
          DICOM_ORACLE_SKIP_BUILD: "1"
        run: bash scripts/dicom-oracle-smoke.sh
      - name: Spotless
        run: mvn -B spotless:check
